services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: secure_file_upload
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secure_file_upload"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/secure_file_upload
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      UPLOAD_DIRECTORY: /tmp/secure-file-upload
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
