spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/secure_file_upload}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  error:
    include-message: never
